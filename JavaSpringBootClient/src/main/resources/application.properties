# Server Configuration
server.port=${SERVER_PORT:9999}
spring.application.name=robot Warehouse Gripper Client
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true

# WCF Service Configuration
wcf.service.url=${WCF_SERVICE_URL:http://localhost:8080/WarehouseGripperService.svc}
wcf.service.wsdl=${WCF_SERVICE_WSDL:http://localhost:8080/WarehouseGripperService.svc?wsdl}
wcf.service.timeout=30000

# Logging
logging.level.root=INFO
logging.level.com.robot.warehouse=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# circuit-breaker
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=100
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=false
resilience4j.circuitbreaker.configs.default.ignore-exceptions=

# metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Circuit Breaker Metrics
management.metrics.enable.resilience4j=true
resilience4j.circuitbreaker.metrics.enabled=true
resilience4j.circuitbreaker.metrics.legacy.enabled=false

